[project]
name = "fsq-cont"
version = "0.1.0"
description = "FSQ Knowledge Memory Bank for Gemma continual-learning drift analysis."
requires-python = ">=3.11,<3.13"
readme = "PLAN.md"
dependencies = [
    "transformers>=5.12,<6.0",
    "accelerate>=1.0",
    "torch>=2.3",
    "faiss-gpu>=1.8",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "tqdm>=4.66",
    "peft>=0.12",
    "sentencepiece>=0.2.0",
    "huggingface_hub>=0.25",
    "protobuf>=4.0",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.5,<0.5",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
